spring:
  application:
    name: product-management

  datasource:
    url: jdbc:mysql://localhost:3306/pim_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: pim_user
    password: pim_pass123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 0

server:
  port: 8080

logging:
  level:
    com.pim: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE